# I'm old!
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            build_script: createallprojects.bat
            build_cmd: msbuild game.sln /p:Configuration=Release /p:Platform=win64 /m
            artifact_name: tf2pc-windows

          - os: ubuntu-latest
            build_script: ./buildallprojects
            build_cmd: ""
            artifact_name: tf2pc-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y python3

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y g++-multilib ninja-build lib32z1-dev podman

      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Generate normal Windows project files
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: ${{ matrix.build_script }}

      - name: Build normal Windows projects
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: ${{ matrix.build_cmd }}

      - name: Generate Windows dedicated-server project files
        if: runner.os == 'Windows'
        working-directory: src
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          & ".\creatededicatedserver.ps1"

      - name: Build Windows dedicated server
        if: runner.os == 'Windows'
        working-directory: src
        shell: cmd
        run: msbuild dedicated.sln /p:Configuration=Release /p:Platform=win64 /m

      - name: Create ccache folder
        if: runner.os == 'Linux'
        shell: bash
        run: mkdir -p /home/runner/.ccache

      - name: Build Linux projects
        if: runner.os == 'Linux'
        working-directory: src
        shell: bash
        run: ${{ matrix.build_script }}

      - name: Clean and strip Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          find game/tf2pc/bin/linux64 -type f -executable -exec strip --strip-all {} +
          if [ -f game/tf2pc_linux64 ]; then
            strip --strip-all game/tf2pc_linux64
          fi

      - name: Clean up Windows build
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /r "game" %%f in (*.pdb) do del /q "%%f"

      - name: Upload game folder
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: game/
